name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: actionlint
      - run: shellcheck scripts/*.sh
      - run: yq '.' repos.yaml > /dev/null
      - run: scripts/test-steps.sh
      - run: scripts/test-npm-steps.sh
      - run: scripts/test-mac-app-steps.sh
      - run: scripts/test-container-steps.sh
      - run: scripts/test-npm-bootstrap.sh
      - run: scripts/test-secrets-sync.sh
      - run: scripts/test-deps-automerge.sh

  audit:
    name: Cask audit (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/test-audit-cask.sh
