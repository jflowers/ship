# Container image: build for amd64 and arm64, smoke-test, push a manifest
# =======================================================================
# A repo's own workflow calls this for each image it publishes. In order:
#
#   settings  checks the inputs, and that a push has registry credentials,
#             before any runner builds anything
#   build     on native runners (ubuntu-latest for amd64, ubuntu-24.04-arm
#             for arm64; no QEMU): podman build, then the caller's `smoke`
#             commands against the image ($IMAGE is its local name), then
#             saves it as an artifact for one day
#   push      only with `push: true`: loads both images, logs in to the
#             image's registry (password on stdin, never on the command
#             line), and pushes one multi-arch manifest under every tag
#
# Pass `push: ${{ github.event_name != 'pull_request' }}` to build and test
# pull requests without pushing.
#
# Caller permissions: contents: read.

name: Container image

on:
  workflow_call:
    inputs:
      image:
        description: The image to push, with its registry and without a tag (e.g. quay.io/org/name).
        required: true
        type: string
      containerfile:
        description: The Containerfile, from the repo root.
        type: string
        default: Containerfile
      context:
        description: The build context, from the repo root.
        type: string
        default: .
      tags:
        description: Tags to push the manifest under, separated by spaces or newlines.
        type: string
        default: latest
      push:
        description: Push the manifest. False = build and smoke-test only.
        type: boolean
        default: false
      smoke:
        description: Shell commands run against each architecture's image, with $IMAGE set to its local name (e.g. podman run --rm "$IMAGE" tool --version).
        type: string
        default: ""
    secrets:
      REGISTRY_USERNAME:
        description: Registry login. Required with `push`.
        required: false
      REGISTRY_PASSWORD:
        description: Registry password or token. Required with `push`.
        required: false

permissions: {}

jobs:
  settings:
    name: Settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      registry: ${{ steps.s.outputs.registry }}
      tags: ${{ steps.s.outputs.tags }}
      name: ${{ steps.s.outputs.name }}
    steps:
      # Tested by scripts/test-container-steps.sh (via yq). Keep the step id
      # and its env interface.
      - id: s
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
          PUSH: ${{ inputs.push }}
          HAS_REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME != '' }}
          HAS_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          # registry/path[/path...], lowercase, no tag or digest.
          if ! [[ $IMAGE =~ ^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+$ ]] || [[ $IMAGE != */* ]]; then
            echo "::error::image is '$IMAGE'; use registry/path/name with no tag (e.g. quay.io/org/name)"
            exit 1
          fi
          registry=${IMAGE%%/*}
          if [[ $registry != *.* && $registry != *:* && $registry != localhost ]]; then
            echo "::error::image '$IMAGE' doesn't start with a registry host (e.g. quay.io/)"
            exit 1
          fi
          tags=()
          for tag in $TAGS; do
            if ! [[ $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::'$tag' isn't a valid image tag"
              exit 1
            fi
            tags+=("$tag")
          done
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::tags is empty"
            exit 1
          fi
          if [ "$PUSH" = true ]; then
            missing=()
            [ "$HAS_REGISTRY_USERNAME" = true ] || missing+=(REGISTRY_USERNAME)
            [ "$HAS_REGISTRY_PASSWORD" = true ] || missing+=(REGISTRY_PASSWORD)
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::push is true but ${missing[*]} wasn't passed"
              exit 1
            fi
          fi
          {
            echo "registry=$registry"
            echo "tags=${tags[*]}"
            echo "name=${IMAGE##*/}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: settings
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      IMAGE: localhost/${{ needs.settings.outputs.name }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          CONTAINERFILE: ${{ inputs.containerfile }}
          CONTEXT: ${{ inputs.context }}
        run: podman build --pull=always -t "$IMAGE" -f "$CONTAINERFILE" "$CONTEXT"
      - name: Smoke test
        if: inputs.smoke != ''
        env:
          SMOKE: ${{ inputs.smoke }}
        run: bash -euo pipefail -c "$SMOKE"
      - name: Save
        if: inputs.push
        run: podman save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
      - if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.settings.outputs.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  push:
    name: Push manifest
    needs: [settings, build]
    if: inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NAME: ${{ needs.settings.outputs.name }}
      REGISTRY: ${{ needs.settings.outputs.registry }}
      TARGET: ${{ inputs.image }}
      TAGS: ${{ needs.settings.outputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.settings.outputs.name }}-*
          path: ${{ runner.temp }}/images
      - name: Load
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            podman load -i "$RUNNER_TEMP/images/$NAME-$arch/image.tar"
          done
      - name: Log in to ${{ needs.settings.outputs.registry }}
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASSWORD" | podman login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
      - name: Push ${{ inputs.image }}
        run: |
          set -euo pipefail
          podman manifest create "$NAME"
          for arch in amd64 arm64; do
            podman manifest add "$NAME" "containers-storage:localhost/$NAME-$arch"
          done
          for tag in $TAGS; do
            podman manifest push "$NAME" "docker://$TARGET:$tag"
            echo "::notice::Pushed $TARGET:$tag"
          done
      - name: Log out
        if: always()
        run: podman logout "$REGISTRY" 2>/dev/null || true
