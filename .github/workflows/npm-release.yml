# npm release, shared by every npm package in repos.yaml
# =====================================================
# A repo's own publish workflow calls this with a tag. A release is then one
# dispatch, plus a 2FA approval on npmjs.com when the version is staged: the
# version comes from the tag (`version_from: tag`, the default), so there's
# no bump to commit first. In order:
#
#   settings        before anything is tagged: checks the inputs and that the
#                   run is on the default branch, decides whether to stage,
#                   and checks package.json (repository.url, and with
#                   `version_from: package` the version against the tag) on
#                   the commit about to be tagged
#   preflight       org-infra: semver, tag uniqueness, CI on HEAD,
#                   unreleased commits; creates the annotated tag
#   publish         checks out the tag, checks package.json against the tag
#                   and the repo, installs, runs the caller's checks, sets
#                   the version from the tag, then
#                   publishes through npm trusted publishing (OIDC, no
#                   token), or stages the version for a maintainer to approve
#                   on npmjs.com. A version already on npm is skipped, so a
#                   re-run still reaches the GitHub release.
#   github-release  creates the GitHub release for the tag with generated
#                   notes (a prerelease for vX.Y.Z-suffix tags), unless it
#                   exists. A staged version shows here before it's public;
#                   if it's rejected on npm, delete the release by hand.
#
# Staging (`stage: auto`, the default): packages in an organization are
# staged for a maintainer's 2FA approval; packages in a personal account are
# published straight away.
#
# Trusted publishing: npm checks the *calling* workflow's file name, so the
# trusted publisher on npmjs.com names the caller (e.g. publish.yml), never
# this file, and renaming the caller breaks publishing until it's updated
# there. When the trusted publisher names a GitHub environment, pass it as
# `environment`. Provenance is generated automatically.
#
# Lifecycle scripts don't run at publish (--ignore-scripts): `checks` must
# build whatever the package ships.
#
# Caller permissions: contents: write, checks: read, id-token: write.

name: npm release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release (e.g. v1.2.3)
        required: true
        type: string
      ci_checks:
        description: JSON array of check-run names that must pass on HEAD. Empty = org-infra auto-discovery.
        type: string
        default: ""
      allow_prerelease:
        description: Accept vX.Y.Z-suffix tags. A prerelease is published under the `next` dist-tag, not `latest`.
        type: boolean
        default: true
      skip_semver_check:
        type: boolean
        default: false
      skip_ci_checks:
        type: boolean
        default: false
      skip_unreleased_check:
        type: boolean
        default: false
      version_from:
        description: >-
          `tag`: the version is set from the tag at publish time, without a
          commit, so package.json can hold a placeholder (0.0.0-development).
          `package`: package.json's version must equal the tag (minus the v),
          so each release needs a bump committed first.
        type: string
        default: tag
      stage:
        description: >-
          `auto`: stage when the repo belongs to an organization, publish
          when it's in a personal account. `true`: stage the version (npm
          stage publish) for a maintainer to approve on npmjs.com. `false`:
          publish it.
        type: string
        default: auto
      github_release:
        description: Create the GitHub release for the tag, with generated notes.
        type: boolean
        default: true
      environment:
        description: GitHub environment for the publish job; must match the trusted publisher's environment, if it names one.
        type: string
        default: ""
      node_version:
        type: string
        default: "24"
      bun_version:
        description: Set up Bun at this version (e.g. 1.4.4 or latest). Empty = no Bun.
        type: string
        default: ""
      npm_version:
        description: npm CLI used to publish. Trusted publishing needs 11.5.1+, staging 11.15.0+.
        type: string
        default: "11.21.2"
      install:
        description: Installs dependencies.
        type: string
        default: npm ci
      checks:
        description: Shell commands run after install, before publishing (typecheck, tests, build, package checks).
        type: string
        default: ""
    outputs:
      tag:
        value: ${{ jobs.preflight.outputs.tag }}

permissions: {}

jobs:
  settings:
    name: Settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the package.json check
    outputs:
      stage: ${{ steps.s.outputs.stage }}
    steps:
      - id: s
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          VERSION_FROM: ${{ inputs.version_from }}
          NPM_VERSION: ${{ inputs.npm_version }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run the release from $DEFAULT_BRANCH (this run is on $REF)"
            exit 1
          fi
          case "$VERSION_FROM" in
            package | tag) ;;
            *) echo "::error::version_from is '$VERSION_FROM'; use package or tag"; exit 1 ;;
          esac
          case "$STAGE:$OWNER_TYPE" in
            auto:Organization) stage=true ;;
            auto:User) stage=false ;;
            auto:*) echo "::error::stage is auto but the owner type is '$OWNER_TYPE'; pass stage: true or false"; exit 1 ;;
            true:* | false:*) stage=$STAGE ;;
            *) echo "::error::stage is '$STAGE'; use auto, true or false"; exit 1 ;;
          esac
          # Oldest npm that can do the job: 11.5.1 for trusted publishing,
          # 11.15.0 for staging.
          need=11.5.1
          [ "$stage" = true ] && need=11.15.0
          if ! printf '%s\n%s\n' "$need" "$NPM_VERSION" | sort -C -V; then
            echo "::error::npm_version $NPM_VERSION is too old; this release needs $need or later"
            exit 1
          fi
          if [ "$stage" = true ]; then
            echo "::notice::The version will be staged; approve it on npmjs.com (2FA) to make it public"
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      # The commit preflight is about to tag. A mismatch here fails the run
      # before anything is tagged, so the same tag can be dispatched again
      # once it's fixed. publish repeats these checks against the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check package.json
        id: package
        env:
          TAG: ${{ inputs.tag }}
          VERSION_FROM: ${{ inputs.version_from }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          repo_url=$(node -p 'const r = require("./package.json").repository; (typeof r === "string" ? r : (r && r.url)) || ""')
          want=${TAG#v}
          norm=$(printf '%s' "$repo_url" | sed -E 's#^(git\+)?(https?|ssh|git)://(git@)?##; s#^git@github\.com:#github.com/#; s#\.git$##')
          if [ "$norm" != "github.com/$GITHUB_REPOSITORY" ]; then
            echo "::error::package.json repository.url is '$repo_url'; trusted publishing needs it to be https://github.com/$GITHUB_REPOSITORY. Nothing was tagged."
            exit 1
          fi
          if [ "$VERSION_FROM" = package ] && [ "$version" != "$want" ]; then
            echo "::error::package.json version is $version but the tag is $TAG; bump it to $want (or pass version_from: tag), then dispatch $TAG again. Nothing was tagged."
            exit 1
          fi

  preflight:
    name: Preflight
    needs: settings
    uses: complytime/org-infra/.github/workflows/reusable_release_preflight.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    with:
      tag: ${{ inputs.tag }}
      ci_checks: ${{ inputs.ci_checks }}
      allow_prerelease: ${{ inputs.allow_prerelease }}
      skip_semver_check: ${{ inputs.skip_semver_check }}
      skip_ci_checks: ${{ inputs.skip_ci_checks }}
      skip_unreleased_check: ${{ inputs.skip_unreleased_check }}
    permissions:
      contents: write
      checks: read

  publish:
    name: ${{ needs.settings.outputs.stage == 'true' && 'Stage' || 'Publish' }} to npm
    needs: [settings, preflight]
    if: needs.preflight.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # trusted publishing
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: https://registry.npmjs.org
      - name: Install npm ${{ inputs.npm_version }}
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
        run: npm install -g "npm@$NPM_VERSION"

      - name: Check package.json
        id: package
        env:
          VERSION_FROM: ${{ inputs.version_from }}
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          repo_url=$(node -p 'const r = require("./package.json").repository; (typeof r === "string" ? r : (r && r.url)) || ""')
          want=${TAG#v}
          # Trusted publishing rejects a package whose repository.url isn't
          # this repo; say so now rather than as ENEEDAUTH at publish time.
          norm=$(printf '%s' "$repo_url" | sed -E 's#^(git\+)?(https?|ssh|git)://(git@)?##; s#^git@github\.com:#github.com/#; s#\.git$##')
          if [ "$norm" != "github.com/$GITHUB_REPOSITORY" ]; then
            echo "::error::package.json repository.url is '$repo_url'; trusted publishing needs it to be https://github.com/$GITHUB_REPOSITORY"
            exit 1
          fi
          if [ "$VERSION_FROM" = package ] && [ "$version" != "$want" ]; then
            echo "::error::package.json version is $version but the tag is $TAG; bump it to $want (or pass version_from: tag)"
            exit 1
          fi
          # Already public (an earlier run, approved): nothing to publish,
          # but the run goes on to the GitHub release.
          if npm view "$name@$want" version >/dev/null 2>&1; then
            published=true
            echo "::notice::$name@$want is already on npm; skipping the checks and publishing"
          else
            published=false
          fi
          case "$want" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          {
            echo "name=$name"
            echo "version=$want"
            echo "dist_tag=$dist_tag"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"

      - if: steps.package.outputs.published == 'false' && inputs.bun_version != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun_version }}
      - name: Install
        if: steps.package.outputs.published == 'false'
        env:
          INSTALL: ${{ inputs.install }}
        run: bash -euo pipefail -c "$INSTALL"
      - name: Checks
        if: steps.package.outputs.published == 'false' && inputs.checks != ''
        env:
          CHECKS: ${{ inputs.checks }}
        run: bash -euo pipefail -c "$CHECKS"

      # After the checks, which test the tag as committed.
      - name: Set the version from the tag
        if: steps.package.outputs.published == 'false' && inputs.version_from == 'tag'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: ${{ needs.settings.outputs.stage == 'true' && 'Stage' || 'Publish' }} ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        if: steps.package.outputs.published == 'false'
        env:
          STAGE: ${{ needs.settings.outputs.stage }}
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
        run: |
          set -euo pipefail
          cmd=(npm publish)
          [ "$STAGE" = true ] && cmd=(npm stage publish)
          "${cmd[@]}" --provenance --tag "$DIST_TAG" --ignore-scripts
          if [ "$STAGE" = true ]; then
            echo "::notice::Staged; approve it on npmjs.com (2FA) to make it public"
          fi

  github-release:
    name: GitHub release
    needs: [preflight, publish]
    if: inputs.github_release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; leaving it unchanged"
            exit 0
          fi
          flags=(--verify-tag --generate-notes)
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${flags[@]}"
