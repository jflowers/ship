# Every repo that publishes something, and how. The source of truth for
# which shared workflow a repo calls, which tap it publishes to, and (later)
# gh ship status/release, the sync job, and gh-hud's toolkit.toml.
#
# kinds:   go-cli        GoReleaser binaries (+ macOS signing when the
#                        signing secrets are passed)
#          cask          a Homebrew cask pushed to `tap`
#          formula       a Homebrew formula pushed to `tap`
#          mac-app       a signed, notarized .app (Swift)
#          android-apk   a signed APK
#          npm | pypi | container | cue-module
# workflow: the shared workflow it calls today; "own" = not migrated yet.
# migrating: the open PR that moves it to a shared workflow, until merged.
# mise:     its pin in chezmoi's dot_config/mise/config.toml, if any.
# secrets:  the secret sets (below) its release needs; a repo with a `tap`
#           also gets that tap's token as HOMEBREW_TAP_TOKEN.

taps:
  jflowers: jflowers/homebrew-tools
  unbound-force: unbound-force/homebrew-tap

# Release secrets, set by scripts/secrets-sync.sh. The values live in the
# dotfiles: env files (KEY='value' lines) that chezmoi decrypts from
# secrets/*.age. Nothing here is a value.
secrets:
  sources:
    apple-developer: ~/.config/apple-developer
    android-release: ~/.config/android-release
  # Each secret's name -> source, or source:KEY when the file's key differs.
  sets:
    macos-sign:
      MACOS_SIGN_P12: apple-developer
      MACOS_SIGN_PASSWORD: apple-developer
      MACOS_NOTARY_KEY: apple-developer
      MACOS_NOTARY_KEY_ID: apple-developer
      MACOS_NOTARY_ISSUER_ID: apple-developer
    android-sign:
      ANDROID_KEYSTORE: android-release
      ANDROID_KEYSTORE_PASSWORD: android-release
      ANDROID_KEY_ALIAS: android-release
      ANDROID_KEY_PASSWORD: android-release
  # The token each tap's publishers get as HOMEBREW_TAP_TOKEN: a fine-grained
  # token with contents read/write on that tap only.
  taps:
    jflowers/homebrew-tools: apple-developer:HOMEBREW_TAP_TOKEN
    unbound-force/homebrew-tap: apple-developer:HOMEBREW_TAP_TOKEN_UNBOUND_FORCE
  # Owners whose secrets are set once, as organization secrets visible only
  # to the repos listed here, instead of copied into each repo. (A personal
  # account has no org secrets, so jflowers repos get repo secrets.)
  orgs: [unbound-force]

repos:
  # --- unbound-force ---
  unbound-force/replicator:
    kinds: [go-cli, cask]
    secrets: [macos-sign]
    tap: unbound-force/homebrew-tap
    workflow: go-release.yml@v0.2.1 # unbound-force/replicator#176
    notes: >-
      the live Casks/replicator.rb (0.7.0) has "#{staged_path}" in
      postflight_steps, which Homebrew 7 can't read; main has the fix, and
      the next release publishes it
  unbound-force/dewey:
    kinds: [go-cli, cask]
    secrets: [macos-sign]
    tap: unbound-force/homebrew-tap
    workflow: go-release.yml@v0.2.1 # unbound-force/dewey#246
    notes: >-
      its cask uses the deprecated `postflight do` hook (a hard error in
      Homebrew after 2027-12-11); move it to postflight_steps like replicator
    mise: go:github.com/unbound-force/dewey/v3
  unbound-force/gaze:
    kinds: [go-cli, cask]
    secrets: [macos-sign]
    tap: unbound-force/homebrew-tap
    workflow: go-release.yml@v0.2.1 # unbound-force/gaze#362
    notes: >-
      its tap token is the repo secret HOMEBREW_TAP_GITHUB_TOKEN, mapped to
      HOMEBREW_TAP_TOKEN in its caller (the sync leaves it alone); keeps
      three release gates and post-release-install-check.yml of its own
    mise: go:github.com/unbound-force/gaze/v2/cmd/gaze
  unbound-force/unbound-force:
    kinds: [go-cli, cask, formula]
    secrets: [macos-sign]
    tap: unbound-force/homebrew-tap
    workflow: own
    notes: formula + staging-tap install test; needs formula support in go-release.yml
    mise: go:github.com/unbound-force/unbound-force/cmd/unbound-force
  unbound-force/containerfile:
    kinds: [container]
    workflow: own
    notes: quay.io with username/password; actions not SHA-pinned
  unbound-force/intake-kit:
    kinds: [cue-module]
    workflow: own

  # --- zero-dot-force ---
  zero-dot-force/vibe-check:
    kinds: [go-cli]
    workflow: own # org-infra at an untagged main SHA
    mise: go:github.com/zero-dot-force/vibe-check/cmd/vibe-check
  zero-dot-force/snake-eyes:
    kinds: [pypi]
    workflow: own # PyPI trusted publishing must stay in the caller's job
  zero-dot-force/reading-stone:
    kinds: [npm]
    workflow: npm-release.yml@v0.4.0 # zero-dot-force/reading-stone#34, #37
    migrating: https://github.com/zero-dot-force/reading-stone/pull/39 # npm-release.yml@v0.5.0
    notes: >-
      always staged (stage: "true"; approved on npmjs.com with 2FA), version
      taken from the tag; npm's trusted publisher names release.yml and the
      `npm` environment. v0.2.2 was the first release through ship (on
      v0.3.0, GitHub release created by hand)

  # --- jflowers ---
  jflowers/gh-hud:
    kinds: [go-cli, mac-app, cask, android-apk]
    secrets: [macos-sign, android-sign]
    tap: jflowers/homebrew-tools
    workflow: own
    mise: go:github.com/jflowers/gh-hud/cmd/gh-hud
  jflowers/get-out:
    kinds: [go-cli, cask]
    secrets: [macos-sign]
    tap: jflowers/homebrew-tools
    workflow: own
  jflowers/gh-slack-notify:
    kinds: [go-cli]
    workflow: none # released by tag only; built from source by mise
    mise: go:github.com/jflowers/gh-slack-notify/cmd/gh-slack-notify
  jflowers/ghws:
    kinds: [go-cli]
    workflow: none # pinned to a commit in mise
    mise: go:github.com/jflowers/ghws/cmd/ghws
  jflowers/opencode-supervisor:
    kinds: [npm]
    workflow: npm-release.yml@v0.5.0 # jflowers/opencode-supervisor#85, #90
    notes: >-
      published directly (personal account, stage: auto); npm's trusted
      publisher names publish.yml, which stays as the caller
  jflowers/opencode-auto-question:
    kinds: [npm]
    workflow: npm-release.yml@v0.5.0 # jflowers/opencode-auto-question#42, #44
    notes: >-
      published directly (personal account, stage: auto); npm's trusted
      publisher names publish.yml, which stays as the caller
  jflowers/opencode-session-search:
    kinds: [npm]
    workflow: npm-release.yml@v0.5.0 # jflowers/opencode-session-search#2, #4
    notes: >-
      publishes as opencode-session-searcher (the unscoped name is
      taken); not on npm yet: first publish 0.1.0 by hand, add the
      trusted publisher (publish.yml), then dispatch v0.1.0
  jflowers/opencode-session-notes:
    kinds: [npm]
    workflow: npm-release.yml@v0.5.0 # jflowers/opencode-session-notes#3, #5
    notes: >-
      not on npm yet: first publish 0.1.0 by hand, add the trusted
      publisher (publish.yml), then dispatch v0.1.0
  jflowers/opencode-research-harness:
    kinds: [npm]
    workflow: npm-release.yml@v0.5.0 # jflowers/opencode-research-harness#11, #13
    notes: >-
      private repo: make public before the first release (no
      provenance from private repos); not on npm yet: first publish
      0.1.0 by hand, add the trusted publisher (publish.yml), then
      dispatch v0.1.0
  jflowers/opencode-debug-harness:
    kinds: [npm]
    workflow: npm-release.yml@v0.5.0 # jflowers/opencode-debug-harness#1, #5
    notes: >-
      #3 merged into feat/phase-1, so it reaches main with #1; private repo: make public before
      the first release; not on npm yet: first publish 0.1.0 by hand,
      add the trusted publisher (publish.yml), then dispatch v0.1.0
