# Fixture for test-secrets-sync.sh: acme is an org that gets org secrets,
# me is a personal account.
secrets:
  sources:
    apple-developer: ~/.config/apple-developer
  sets:
    sign:
      MACOS_SIGN_P12: apple-developer
      MACOS_SIGN_PASSWORD: apple-developer
      MACOS_NOTARY_KEY: apple-developer:EMPTY_ONE
  taps:
    acme/tap: apple-developer:ACME_TAP
    me/tap: apple-developer
  orgs: [acme]

repos:
  acme/one:
    secrets: [sign]
    tap: acme/tap
  acme/two:
    secrets: [sign]
    tap: acme/tap
  me/app:
    secrets: [sign]
    tap: me/tap
  me/lib:
    kinds: [go-cli]
